name: Attach release files

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '"version"' module.json | sed 's/.*: *"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Make module.zip
        run: zip -r module.zip . -x ".git/*" ".github/*" ".gitignore" "tests/*" "*.zip"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.version }}" module.zip module.json --clobber
